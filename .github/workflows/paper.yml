name: Паперова торгівля

on:
  schedule:
    - cron: "4 * * * *"    # щогодини, одразу після закриття годинної свічки
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: tradesim
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Встановити залежності
        run: pip install -r requirements.txt
      - name: Бектест, якщо його ще немає (потрібні параметри)
        run: test -f docs/data/backtest.json || python -m tradesim backtest
      - name: Один цикл паперової торгівлі
        run: python -m tradesim paper
      - name: Зберегти стан
        run: |
          git config user.name "tradesim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then echo "Змін немає"; exit 0; fi
          git commit -q -m "Паперова торгівля $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Не дати GitHub вимкнути розклад (раз на добу)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/paper.yml/enable" || true
          fi
