name: Бектест стратегій

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * 0"   # щонеділі, оновити результати на свіжій історії

permissions:
  contents: write

concurrency:
  group: tradesim
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Встановити залежності
        run: pip install -r requirements.txt
      - name: Бектест
        run: python -m tradesim backtest
      - name: Зберегти результати
        run: |
          git config user.name "tradesim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "Змін немає"; exit 0; fi
          git commit -q -m "Бектест $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
